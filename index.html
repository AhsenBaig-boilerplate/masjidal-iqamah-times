<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athan & Iqamah Timings Adjuster</title>
  <!-- Tailwind CSS via CDN for rapid prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./style.css?v=20260418-57">
  <!-- Masjidal timetable widget (fonts must load at page level; its shadow DOM can't load them itself) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Lato:wght@400;700&family=Amiri:wght@400;700&display=swap">
  <script async src="https://widgets.masjidal.com/timetable/v0/widget.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
  <div id="app-container" class="flex flex-col items-center py-8">
    <div class="mb-4 flex gap-2">
      <button id="theme-toggle" class="px-4 py-2 rounded bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 border border-gray-400 dark:border-gray-600">🌗 System</button>
      <button id="debug-toggle" class="px-4 py-2 rounded bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-100 border border-gray-400 dark:border-gray-600">🐛 Debug: OFF</button>
    </div>
    <div class="w-full max-w-7xl mb-6 grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
      <masjidal-widget
        async
        widget-id="RfxLX5HXTn9Ql6cbvrV-p"
        type="prayer"
        api-key="msj_pk_xr5nH6zSlPbNz40PhGRQyo8uasrlSnzJ0njKURo1DzU">
      </masjidal-widget>
      <masjidal-widget
        async
        widget-id="RfxLX5HXTn9Ql6cbvrV-p"
        type="announcement"
        api-key="msj_pk_xr5nH6zSlPbNz40PhGRQyo8uasrlSnzJ0njKURo1DzU">
      </masjidal-widget>
    </div>
    <div id="app" class="w-full max-w-7xl"></div>
  </div>
  <script>
    const script = document.createElement('script');
    script.type = 'module';
    script.src = './src/app.js?v=' + Date.now();
    document.body.appendChild(script);
  </script>
</body>
</html>
