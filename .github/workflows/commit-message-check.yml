name: Commit Message Check

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  commit-message-check:
    runs-on: ubuntu-latest
    # Dependabot generates its own commit format; skip validation for its PRs
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Get PR commits
        id: commits
        uses: tim-actions/get-pr-commits@198af03565609bb4ed924d1260247b4881f09e7d # v1.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check commit messages
        env:
          COMMITS_JSON: ${{ steps.commits.outputs.commits }}
        run: |
          regex='^(feat|fix|chore|docs|style|refactor|perf|test|ci|build|revert)(\(.+\))?: .+'
          failed=0
          # Skip merge commits (2+ parents); only check the subject line of regular commits
          while IFS= read -r msg; do
            if ! echo "$msg" | grep -qE "$regex"; then
              echo "::error::Commit message does not follow Conventional Commits: '$msg'"
              failed=1
            fi
          done < <(echo "$COMMITS_JSON" | jq -r '[.[] | select((.parents | length) < 2)] | .[].commit.message | split("\n")[0]')
          exit $failed
